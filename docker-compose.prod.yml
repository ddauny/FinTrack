version: '3.8'

services:
  db-prod:
    image: postgres:15-alpine
    container_name: fintrack-prod-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - fintrack-prod-data:/var/lib/postgresql/data
    restart: always

  app-prod:
    container_name: fintrack-prod-app
    build:
      context: .
      dockerfile: ./server/Dockerfile.prod
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      - db-prod
    restart: always

  client-prod:
    container_name: fintrack-prod-client
    build:
      context: .
      dockerfile: ./client/Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - app-prod
    restart: always

volumes:
  fintrack-prod-data:
