services:
  #################
  # Database
  #################
  db:
    image: postgres:15-alpine
    container_name: fintrack-prod-db
    env_file: ".env.prod"
    volumes:
      - fintrack-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - fintrack-prod

  #################
  # Backup (Produzione)
  #################
  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: fintrack-prod-db-backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    env_file: ".env.prod"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - SCHEDULE=@daily
      - BACKUP_PREFIX=fintrack-backup
      - BACKUP_KEEP_DAYS=7
    depends_on:
      - db
    networks:
      - fintrack-prod

  #################
  # Backend (Server)
  #################
  app:
    container_name: fintrack-prod-app
    build:
      context: .
      dockerfile: ./server/Dockerfile.prod
    env_file: ".env.prod"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    command: sh -c "npx prisma migrate deploy && npm run start"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fintrack-prod

  #################
  # Frontend (Nginx)
  #################
  client:
    container_name: fintrack-prod-client
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    environment:
      - BACKEND_SERVICE_NAME=app
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - web-proxy
      - fintrack-prod

volumes:
  fintrack-prod-data:
    name: fintrack-prod-data

networks:
  web-proxy:
    external: true
  fintrack-prod:
    driver: bridge
