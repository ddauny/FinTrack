services:
  #################
  # Database
  #################
  db:
    image: postgres:15-alpine
    container_name: fintrack-prod-db
    env_file:
      - .env.prod
    volumes:
      - fintrack-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped 
  #################
  # Backend (Server)
  #################
  app:
    container_name: fintrack-prod-app
    build:
      context: .
      dockerfile: ./server/Dockerfile.prod
    env_file:
      - .env.prod
    command: sh -c "npx prisma migrate deploy && npm run start"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  
  #################
  # Frontend (Nginx)
  #################
  client:
    container_name: fintrack-prod-client
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    environment:
      - BACKEND_SERVICE_NAME=app
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - web-proxy
      - default
volumes:
  fintrack-prod-data:
    name: fintrack-prod-data

networks:
  web-proxy:
    external: true
