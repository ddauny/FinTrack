services:
  #################
  # Database (Sviluppo)
  #################
  db-dev:
    image: postgres:15-alpine
    container_name: fintrack-dev-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fintrack
    volumes:
      - fintrack-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  #################
  # Backend (Sviluppo)
  #################
  app-dev:
    container_name: fintrack-dev-app
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env.dev
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"
    depends_on:
      db-dev:
        condition: service_healthy

  #################
  # Frontend (Sviluppo)
  #################
  client-dev:
    container_name: fintrack-dev-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    depends_on:
      - app-dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BACKEND_SERVICE_NAME=app-dev
    networks:
      - web-proxy
      - default

volumes:
  fintrack-dev-data:
    name: fintrack-dev-data

networks:
  web-proxy:
    external: true
